<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحبك يا أبودي ♥️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

       .container {
            background: white;
            border-radius: 25px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #764ba2;
            margin-bottom: 25px;
            font-size: 28px;
        }

       .btn {
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

       .btn-love {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

       .btn-coupon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            line-height: 1.4;
        }

       .btn:active {
            transform: scale(0.95);
        }

       .result-box {
            margin-top: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 17px;
            line-height: 1.6;
            border: 2px dashed #ddd;
        }

       .result-box.active {
            border: 2px solid #764ba2;
            background: #fff;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

       .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
            margin: 25px 0;
        }

       .heart {
            font-size: 24px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>بحبك يا أبودي <span class="heart">♥️</span></h1>

        <!-- زرار ليه بحبك -->
        <button class="btn btn-love" onclick="showReason()">
            ليه بحبك؟
        </button>
        <div id="reasonBox" class="result-box">
            دوس على الزرار عشان تعرف 🥺
        </div>

        <div class="divider"></div>

        <!-- زرار الكوبونات -->
        <button class="btn btn-coupon" onclick="showCoupon()">
            ليك كل يوم كوبون جديد<br>لمدة 10 أيام
        </button>
        <div id="couponBox" class="result-box">
            دوس عشان تشوف كوبون النهاردة 😂
        </div>
    </div>

    <script>
        // الـ 20 سبب
        const reasons = [
            "عشان انت أماني في الدنيا دي ♥️",
            "عشان ضحكتك بتنسيني أي زعل",
            "عشان انت أول حد بفكر فيه لما أفرح",
            "عشان بحس إني طفلة معاك",
            "عشان انت بتفهمني من غير ما أتكلم",
            "عشان في حضنك بنسى الدنيا كلها",
            "عشان انت سندي وضهري",
            "عشان بتحبني وأنا في أسوأ حالاتي",
            "عشان انت السبب اللي بيخليني أصحى مبسوطة",
            "عشان لما بتبصلي بحس إني ملكة",
            "عشان انت بتخليني أحب نفسي أكتر",
            "عشان كل حاجة معاك ليها طعم تاني",
            "عشان انت بيتي اللي برتاح فيه",
            "عشان صوتك بيطمني مهما كنت خايفة",
            "عشان انت بتخلي المستحيل ممكن",
            "عشان وجودك في حياتي نعمة بحمد ربنا عليها",
            "عشان انت الوحيد اللي بعرف أكون نفسي معاه",
            "عشان لما بتزعل ببقى عايزة أشيل الزعل عنك",
            "عشان انت الحلم اللي اتحقق",
            "عشان ببساطة.. انت ♥️"
        ];

        // الـ 10 كوبونات
        const coupons = [
            "كوبون مش هنكد عليك<br>صالح لمدة 48 ساعه كاملين 😂",
            "كوبون مش هندب<br>صالح لمدة أسبوع 🙆🏻‍♀️🥲",
            "كوبون اختار اي اكله بتحبها من ايدي واعملهالك النهارده ♥️",
            "كوبون حضن مجاني صالح لمدي الحياه من غير سبب",
            "كوبون حاجات حلوه تجيلك النهارده",
            "كوبون يوم كامل دلع",
            "كوبون بوسه كبيره",
            "كوبون اعزمك ع الغدا ف المكان اللي تختاره مهما كان",
            "كوبون هصالحك حتى لو انت الغلطان 🥺♥️",
            "كوبون هسيبك تلعب دومنا من غير زن 😂"
        ];

        function showReason() {
            const box = document.getElementById('reasonBox');
            const randomIndex = Math.floor(Math.random() * reasons.length);
            box.innerHTML = reasons[randomIndex];
            box.classList.add('active');
        }

        function showCoupon() {
            const box = document.getElementById('couponBox');

            // نجيب تاريخ النهاردة ونحوله لرقم اليوم من بداية الشهر
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);

            // نختار كوبون ثابت لليوم ده
            const couponIndex = dayOfYear % coupons.length;
            box.innerHTML = coupons[couponIndex];
            box.classList.add('active');
        }
    </script>
</body>
</html>
